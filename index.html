
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding | Our Special Day</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="website-container">

        <!-- Navigation -->
        <header class="navbar">

            <a href="#" class="logo">

            <nav class="nav-menu">
                <a href="/">HOME</a>
                <a href="#story">OUR STORY</a>
