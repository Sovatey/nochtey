
name: Deploy Nochtey Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engagement/package-lock.json

      - name: Install Engagement dependencies
        working-directory: engagement
        run: npm ci

      - name: Build Engagement
        working-directory: engagement
        run: npm run build

      - name: Prepare website files
        run: |
          mkdir -p _site/engagement
          mkdir -p _site/wedding

          cp -R index.html script.js style.css images favicon.svg _site/

          cp -R wedding/. _site/wedding/

          cp -R engagement/dist/. _site/engagement/

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
